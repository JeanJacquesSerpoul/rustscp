[workspace]
resolver = "3"
members = ["shared", "frontend", "src-tauri", "devbridge"]
default-members = ["src-tauri"]

[workspace.package]
version = "1.3.0"
edition = "2024"
license = "MIT"
authors = ["Jean-Jacques Serpoul <serpoul@gmail.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustscp-shared = { path = "shared" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.release.package.rustscp-ui]
opt-level = "z"
