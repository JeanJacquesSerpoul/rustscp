[package]
name = "rustscp-devbridge"
description = "Passerelle HTTP de développement : l'interface RustSCP dans un navigateur, reliée au vrai cœur"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
rustscp = { path = "../src-tauri" }
rustscp-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
tiny_http = "0.12"
data-encoding = "2"
trash = "5"
